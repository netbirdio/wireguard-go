name: Module path
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  module-path:
    runs-on: ubuntu-latest
    env:
      OLD_PATH: golang.zx2c4.com/wireguard
      NEW_PATH: github.com/netbirdio/wireguard-go
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Module line uses the NetBird path
        run: |
          if ! grep -qx "module ${NEW_PATH}" go.mod; then
            echo "go.mod must declare 'module ${NEW_PATH}'"
            exit 1
          fi

      - name: No import of the upstream path
        run: |
          # A leftover import still compiles because Go fetches the upstream
          # module as a dependency, so a merge from upstream can bring one back.
          if grep -rIn --include='*.go' --include='go.mod' --exclude-dir=.git -e "${OLD_PATH}" .; then
            echo "found ${OLD_PATH}: rewrite it to ${NEW_PATH}"
            exit 1
          fi
